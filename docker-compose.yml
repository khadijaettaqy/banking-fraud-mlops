services:

  kafka:
    image: apache/kafka:3.9.1
    container_name: fraud-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:29092,
        EXTERNAL://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka-data:/var/lib/kafka/data
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: fraud-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

    restart: unless-stopped
  spark-master:
    build:
      context: ./spark
    container_name: fraud-spark-master

    user: "0:0"

    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "7077:7077"
      - "8081:8080"

    volumes:
      - ./spark:/opt/spark-apps

    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
  spark-worker:
    build:
      context: ./spark
    container_name: fraud-spark-worker

    user: "0:0"

    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - "2g"
      - --webui-port
      - "8081"

    ports:
      - "8082:8081"

    depends_on:
      - spark-master

    volumes:
      - ./spark:/opt/spark-apps

    restart: unless-stopped
  postgres:
    image: postgres:16
    container_name: fraud-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped
  mlflow:
    build:
      context: ./mlflow

    container_name: fraud-mlflow

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MLFLOW_SERVER_ALLOWED_HOSTS: "host.minikube.internal:5000,localhost:5000,127.0.0.1:5000,mlflow,mlflow:5000"

    command:
      - /bin/sh
      - -c
      - >
        mlflow server
        --backend-store-uri
        "postgresql+psycopg2://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        --default-artifact-root
        s3://mlflow-artifacts/
        --host 0.0.0.0
        --port 5000

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  airflow:
    build:
      context: ./airflow

    container_name: fraud-airflow

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/data/airflow.db

      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      SPARK_LOCAL_HOSTNAME: airflow

      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1

      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/airflow/scripts
      - ./spark:/opt/spark-apps
      - airflow-data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs

    depends_on:
      - spark-master
      - minio
      - mlflow

    command: standalone

    restart: unless-stopped
  namenode:
    image: apache/hadoop:3.4.1
    container_name: fraud-namenode
    hostname: namenode

    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name

    command: ["hdfs", "namenode"]

    ports:
      - "127.0.0.1:9870:9870"

    volumes:
      - hdfs-namenode:/tmp/hadoop-root/dfs/name
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.4.1
    container_name: fraud-datanode
    hostname: datanode

    user: "root"

    command: ["hdfs", "datanode"]

    depends_on:
      - namenode

    volumes:
      - hdfs-datanode-new:/hadoop/dfs/data
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    restart: unless-stopped
volumes:
  kafka-data:
  minio-data:
  postgres-data:
  airflow-data:
  airflow-logs:
  hdfs-namenode:
  hdfs-datanode:
  hdfs-datanode-new:
